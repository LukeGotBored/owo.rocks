<head>
    <meta charset="UTF-8">

    <meta name="robots" content="noindex,follow">

    <meta name="description" content="Page not found on owo.rocks.">
    <link rel="canonical" href="https://owo.rocks/404.html">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://owo.rocks/404.html">
    <meta property="og:site_name" content="owo.rocks">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="404 | owo.rocks">
    <meta property="og:description" content="Page not found on owo.rocks.">
    <meta property="og:image" content="https://owo.rocks/og.png">
    <meta property="og:image:alt" content="owo.rocks preview image">

    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://owo.rocks/404.html">
    <meta property="twitter:title" content="404 | owo.rocks">
    <meta property="twitter:description" content="Page not found on owo.rocks.">
    <meta property="twitter:image" content="https://owo.rocks/og.png">
    <meta property="twitter:image:alt" content="owo.rocks preview image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="global.css">
    <style>
        .code {
            margin: 0;
            color: var(--accent);
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0.25rem 0 1rem;
            color: var(--heading);
            font-size: clamp(1.5rem, 3.5vw, 2rem);
            line-height: 1.2;
        }

        p {
            margin: 0 0 1rem;
            font-size: 0.95rem;
        }

        

        .actions {
            margin-top: 1.5rem;
        }

        .popover-actions {
            margin: 0;
            padding: 0;
            display: flex;
            gap: 1rem;
            justify-content: flex-start;
            flex-wrap: wrap;
            flex-shrink: 0;
            background: transparent;
        }

        .popover-actions a,
        .popover-actions button {
            all: unset;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            color: var(--accent);
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, .03);
            border-radius: 10px;
            padding: .55rem .85rem;
            line-height: 1.2;
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            touch-action: manipulation;
            transition: border-color .15s ease, color .15s ease, background-color .1s ease;
        }

        .popover-actions .primary-action {
            color: var(--bg);
            background: var(--accent);
            border-color: var(--accent);
            transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
        }

        @media (hover: hover) {
            .popover-actions a:hover,
            .popover-actions button:hover {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(198, 160, 246, 0.05);
            }

            .popover-actions .primary-action:hover {
                background: #d8b8ff;
                border-color: #d8b8ff;
                color: var(--bg);
                filter: brightness(1.08);
            }
        }

        .popover-actions a:active,
        .popover-actions button:active {
            transform: translateY(1px)
        }

        .popover-actions a:focus-visible,
        .popover-actions button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width:600px) {
            .popover-actions a,
            .popover-actions button {
                width: 100%;
            }

            .popover-actions {
                gap: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="mascot" aria-hidden="true">(╥﹏╥)</p>
        <p class="code">Error 404</p>
        <h1>Page Not Found</h1>
        <p>
            You found a <span class="highlight">veeeeery exclusive empty room</span>.
            The link might be old, mistyped or maybe it was just never meant to be.
        </p>
        <p>Good news: the rest of the site <i>should</i> still be where it's supposed to be.</p>

        <nav class="actions" aria-label="404 actions">
            <div class="popover-actions">
                <a class="primary-action" href="/">Take Me Home</a>
            </div>
        </nav>
    </main>
</body>

</html>
